[project]
name = "scientific-slides"
version = "0.1.0"
description = "Browser-native Markdown and Reveal.js presentation editor"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
scientific-slides = "scientific_slides:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scientific_slides"]
