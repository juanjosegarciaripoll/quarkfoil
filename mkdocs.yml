site_name: Quarkfoil
site_description: A local, visual editor for scientific Markdown presentations
site_url: https://juanjosegarciaripoll.github.io/quarkfoil/
repo_url: https://github.com/juanjosegarciaripoll/quarkfoil
repo_name: juanjosegarciaripoll/quarkfoil
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Juan José García-Ripoll

theme:
  name: material
  language: en
  logo: assets/quarkfoil-mark.svg
  favicon: assets/quarkfoil-mark.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Use dark colors
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Use light colors
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - content.action.view

nav:
  - Home: index.md
  - Quick start: QUICK_START.md
  - User guide:
      - Installation and command line: INSTALLATION.md
      - Use with AI assistants: AGENT_CLI.md
      - Editor: USER_GUIDE.md
      - Export a static website: EXPORT.md
      - Presentation format: FORMAT.md
  - Reference:
      - Security: SECURITY.md
      - Licenses: LICENSES.md
      - Development and releases: DEVELOPMENT.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/juanjosegarciaripoll/quarkfoil
      name: Quarkfoil on GitHub
