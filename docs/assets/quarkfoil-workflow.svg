<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="title desc">
  <title id="title">The Quarkfoil workflow</title>
  <desc id="desc">Markdown and figures enter the Quarkfoil visual editor and become a Reveal.js presentation.</desc>
  <defs>
