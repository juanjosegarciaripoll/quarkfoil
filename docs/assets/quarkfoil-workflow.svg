      <path d="M0 0l10 5-10 5z" fill="#28b7c8"/>
    </marker>
  </defs>
  <rect x="10" y="10" width="700" height="450" rx="30" fill="url(#bg)"/>
  <rect x="53" y="76" width="164" height="208" rx="12" fill="#f7fafc"/>
