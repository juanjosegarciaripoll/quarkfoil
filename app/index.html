<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quarkfoil</title>
  <link rel="stylesheet" href="vendor/reveal/reveal.css">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/themes.css">
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <header id="toolbar" class="toolbar" aria-label="Presentation editor toolbar">
    <div class="toolbar__group">
      <button id="open-button" class="toolbar-icon-button" type="button" title="Open presentation" aria-label="Open presentation"><svg class="action-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18.5V6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v1H7l-4 9.5Z"></path><path d="M7 9h14l-3 10H3"></path></svg></button>
      <button id="save-button" class="toolbar-icon-button" type="button" title="Save presentation" aria-label="Save presentation" disabled><svg class="action-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h13l3 3v13H4Z"></path><path d="M8 4v6h8V4M8 20v-6h8v6"></path></svg></button>
      <button id="download-button" class="toolbar-icon-button" type="button" title="Download presentation" aria-label="Download presentation" disabled><svg class="action-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"></path></svg></button>
      <button id="bibliography-button" class="toolbar-icon-button" type="button" title="Bibliography" aria-label="Bibliography"><svg class="action-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5V18a3 3 0 0 1-3 3h11a3 3 0 0 0 3-3V5.5"></path><path d="M8 6a3 3 0 0 0-3-3h11a3 3 0 0 1 3 3H8Z"></path><path d="M11 10h5M11 13h5M11 16h3"></path></svg></button>
      <span id="save-state" class="save-state">No deck</span>
    </div>
    <div class="toolbar__group toolbar__modes" role="group" aria-label="Mode">
      <button data-mode="source" type="button">Source</button>
      <button data-mode="design" type="button" class="active">Design</button>
      <button data-mode="present" type="button">Present</button>
    </div>
    <div class="toolbar__group design-only">
      <label>Layout
        <select id="layout-select">
          <option value="1">1</option>
          <option value="1-1">1+1</option>
          <option value="1-2">1+2</option>
          <option value="2-1">2+1</option>
          <option value="0">0</option>
          <option value="front">Front page</option>
          <option value="free">Free (nothing)</option>
        </select>
      </label>
      <button id="add-text" class="toolbar-icon-button" type="button" title="Add text" aria-label="Add text"><span class="text-glyph roman-t" aria-hidden="true">T</span></button>
      <button id="add-equation" class="toolbar-icon-button" type="button" title="Add equation" aria-label="Add equation"><span class="text-glyph" aria-hidden="true">Ω</span></button>
      <button id="add-image" class="toolbar-icon-button" type="button" title="Add image" aria-label="Add image"><svg class="action-svg" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1.5"></rect><circle cx="8" cy="9" r="1.5"></circle><path d="M4 18l5-5 3.5 3 2.5-2 5 4"></path></svg></button>
      <button id="add-video" class="toolbar-icon-button" type="button" title="Add video" aria-label="Add video"><svg class="action-svg" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="14" height="14" rx="1.5"></rect><path d="m17 10 4-2v8l-4-2Z"></path><path d="m8 9 4 3-4 3Z"></path></svg></button>
      <label>Shape
        <select id="shape-select">
          <option value="rectangle">Rectangle</option>
          <option value="rounded-rectangle">Rounded rectangle</option>
          <option value="ellipse">Ellipse</option>
          <option value="circle">Circle</option>
          <option value="diamond">Diamond</option>
          <option value="hexagon">Hexagon</option>
          <option value="cloud">Cloud</option>
          <option value="callout">Comic callout</option>
          <option value="sine">Sine curve (0–2π)</option>
          <option value="cosine">Cosine curve (0–2π)</option>
        </select>
      </label>
      <button id="add-shape" class="toolbar-icon-button" type="button" title="Add selected shape" aria-label="Add selected shape"><svg class="action-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4Z"></path><path d="M7 9h10M7 12h7"></path></svg></button>
      <button id="duplicate-object" class="toolbar-icon-button" type="button" title="Duplicate selected object" aria-label="Duplicate selected object" disabled><svg class="action-svg" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="1.5"></rect><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"></path></svg></button>
      <button id="delete-object" class="toolbar-icon-button destructive-icon" type="button" title="Delete selected object" aria-label="Delete selected object" disabled><svg class="action-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"></path></svg></button>
    </div>
    <div class="toolbar__group design-only">
      <button id="undo-button" class="toolbar-icon-button" type="button" title="Undo" aria-label="Undo" disabled><svg class="action-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 8H4V3M4.5 7.5A8 8 0 1 1 4 15"></path></svg></button>
      <button id="redo-button" class="toolbar-icon-button" type="button" title="Redo" aria-label="Redo" disabled><svg class="action-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 8h5V3M19.5 7.5A8 8 0 1 0 20 15"></path></svg></button>
    </div>
  </header>

  <main id="workspace" class="workspace mode-design">
    <aside id="slide-sidebar" class="slide-sidebar" aria-label="Slides">
      <div class="slide-sidebar-actions" role="group" aria-label="Selected slide actions">
        <button id="add-slide" type="button" title="Add blank slide with the selected layout" aria-label="Add blank slide with the selected layout"><svg class="action-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
        <button id="duplicate-slide" type="button" title="Duplicate selected slide" aria-label="Duplicate selected slide"><svg class="action-svg" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="1.5"></rect><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"></path></svg></button>
        <button id="delete-slide" type="button" title="Delete selected slide" aria-label="Delete selected slide"><svg class="action-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"></path></svg></button>
      </div>
      <ol id="slide-list"></ol>
      <div class="slide-sidebar-move" role="group" aria-label="Move selected slide">
        <button id="move-slide-up" type="button" title="Move selected slide up" aria-label="Move selected slide up"><svg class="action-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"></path></svg></button>
        <button id="move-slide-down" type="button" title="Move selected slide down" aria-label="Move selected slide down"><svg class="action-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6.5 13.5 12 19l5.5-5.5"></path></svg></button>
      </div>
    </aside>

    <section id="source-pane" class="source-pane" hidden>
      <textarea id="source-editor" spellcheck="false" aria-label="Markdown source"></textarea>
    </section>

    <section id="stage" class="stage">
      <div class="reveal">
        <div id="slides" class="slides"></div>
      </div>
    </section>

    <aside id="properties" class="properties design-only" aria-label="Properties">
      <h2>Properties</h2>
      <div id="no-selection" hidden></div>
      <form id="slide-properties">
        <label>Theme
          <select id="prop-slide-theme">
            <option value="">Deck default</option>
            <option value="scientific-light">Scientific light</option>
            <option value="scientific-dark">Scientific dark</option>
          </select>
        </label>
        <label>Background
          <span class="color-with-alpha-reset"><input id="prop-slide-background" type="color"><span class="alpha-symbol" aria-hidden="true">α</span><input id="prop-slide-background-alpha" type="number" min="0" max="100" value="100" title="Background opacity percent" aria-label="Background opacity percent"><button id="reset-slide-background" type="button" title="Use theme background" aria-label="Use theme background">↺</button></span>
        </label>
        <label>Foreground
          <span class="color-with-alpha-reset"><input id="prop-slide-foreground" type="color"><span class="alpha-symbol" aria-hidden="true">α</span><input id="prop-slide-foreground-alpha" type="number" min="0" max="100" value="100" title="Foreground opacity percent" aria-label="Foreground opacity percent"><button id="reset-slide-foreground" type="button" title="Use theme foreground" aria-label="Use theme foreground">↺</button></span>
        </label>
        <small id="slide-color-state">Colors inherited from theme</small>
      </form>
      <form id="object-properties" hidden>
        <label>ID <input id="prop-id" readonly></label>
        <label>X <input id="prop-x" type="number" step="0.1"></label>
        <label>Y <input id="prop-y" type="number" step="0.1"></label>
        <label>Width <input id="prop-w" type="number" step="0.1"></label>
        <label>Height <input id="prop-h" type="number" step="0.1"></label>
        <label>Fragment <input id="prop-fragment" type="number" min="0" step="1"></label>
        <label>Layer <input id="prop-z" type="number" step="1"></label>
        <label class="check"><input id="prop-locked" type="checkbox"> Locked</label>
        <button id="edit-content" type="button">Edit content</button>
      </form>
      <form id="image-properties" hidden>
        <label>Image fit
          <select id="prop-fit">
            <option value="contain">Fit</option>
            <option value="cover">Fill/crop</option>
            <option value="width">Fit width</option>
            <option value="height">Fit height</option>
            <option value="native">Native</option>
          </select>
        </label>
        <label>Focus X <span class="range-with-value"><input id="prop-focus-x" type="range" min="0" max="100"><input id="prop-focus-x-value" type="number" min="0" max="100" aria-label="Focus X value"></span></label>
        <label>Focus Y <span class="range-with-value"><input id="prop-focus-y" type="range" min="0" max="100"><input id="prop-focus-y-value" type="number" min="0" max="100" aria-label="Focus Y value"></span></label>
        <div class="image-source-actions">
          <button id="replace-image" type="button" title="Upload replacement image" aria-label="Upload replacement image"><svg class="action-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"></path></svg></button>
          <button id="choose-project-image" type="button" title="Choose image from presentation" aria-label="Choose image from presentation"><svg class="action-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18.5V6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v1H7l-4 9.5Z"></path><path d="M7 9h14l-3 10H3"></path><circle cx="11" cy="13" r="1"></circle><path d="m7 18 3-3 2 2 2-2 3 3"></path></svg></button>
        </div>
      </form>
      <form id="video-properties" hidden>
        <label>Video fit
          <select id="prop-video-fit"><option value="contain">Fit</option><option value="cover">Fill/crop</option></select>
        </label>
        <label class="check"><input id="prop-video-controls" type="checkbox"> Controls</label>
        <label class="check"><input id="prop-video-autoplay" type="checkbox"> Autoplay</label>
        <label class="check"><input id="prop-video-loop" type="checkbox"> Loop</label>
        <label class="check"><input id="prop-video-muted" type="checkbox"> Muted</label>
        <label>Poster <input id="prop-video-poster" type="text" placeholder="figures/poster.jpg"></label>
        <div class="image-source-actions">
          <button id="replace-video" type="button" title="Upload replacement video" aria-label="Upload replacement video"><svg class="action-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"></path></svg></button>
          <button id="choose-project-video" type="button" title="Choose video from presentation" aria-label="Choose video from presentation"><svg class="action-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18.5V6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v1H7l-4 9.5Z"></path><path d="M7 9h14l-3 10H3"></path><path d="m10 12 4 2.5-4 2.5Z"></path></svg></button>
        </div>
      </form>
      <form id="shape-properties" hidden>
        <label>Shape
          <select id="prop-shape">
            <option value="rectangle">Rectangle</option>
            <option value="rounded-rectangle">Rounded rectangle</option>
            <option value="ellipse">Ellipse</option>
            <option value="circle">Circle</option>
            <option value="diamond">Diamond</option>
            <option value="hexagon">Hexagon</option>
            <option value="cloud">Cloud</option>
            <option value="callout">Comic callout</option>
            <option value="sine">Sine curve (0–2π)</option>
            <option value="cosine">Cosine curve (0–2π)</option>
          </select>
        </label>
        <label>Background <span class="color-with-alpha"><input id="prop-shape-fill" type="color" value="#dbeff2"><span class="alpha-symbol" aria-hidden="true">α</span><input id="prop-shape-fill-alpha" type="number" min="0" max="100" value="100" title="Background opacity percent" aria-label="Background opacity percent"></span></label>
        <label>Line <span class="color-with-alpha"><input id="prop-shape-stroke" type="color" value="#146c7e"><span class="alpha-symbol" aria-hidden="true">α</span><input id="prop-shape-stroke-alpha" type="number" min="0" max="100" value="100" title="Line opacity percent" aria-label="Line opacity percent"></span></label>
        <label>Line width <input id="prop-shape-stroke-width" type="number" min="0" max="20" step="0.5" value="2"></label>
        <label class="check"><input id="prop-shape-shadow" type="checkbox"> Shadow</label>
      </form>
      <form id="font-properties" hidden>
        <label>Text color
          <span class="color-with-alpha-reset"><input id="prop-text-color" type="color"><span class="alpha-symbol" aria-hidden="true">α</span><input id="prop-text-color-alpha" type="number" min="0" max="100" value="100" title="Text opacity percent" aria-label="Text opacity percent"><button id="reset-text-color" type="button" title="Use theme text color" aria-label="Use theme text color">↺</button></span>
        </label>
        <label>Font size
          <span class="range-with-value">
            <input id="prop-font-size" type="range" min="0.25" max="3" step="0.05" value="1">
            <input id="prop-font-size-value" type="number" min="0.25" max="3" step="0.05" value="1" aria-label="Font size in em">
          </span>
        </label>
        <label>Alignment
          <span class="alignment-buttons" role="group" aria-label="Text alignment">
            <button type="button" data-align="left" title="Align left" aria-label="Align left"><span class="align-icon align-icon-left" aria-hidden="true"><i></i><i></i><i></i></span></button>
            <button type="button" data-align="center" title="Align center" aria-label="Align center"><span class="align-icon align-icon-center" aria-hidden="true"><i></i><i></i><i></i></span></button>
            <button type="button" data-align="right" title="Align right" aria-label="Align right"><span class="align-icon align-icon-right" aria-hidden="true"><i></i><i></i><i></i></span></button>
          </span>
        </label>
      </form>
    </aside>
  </main>

  <dialog id="content-dialog">
    <form method="dialog" class="content-dialog__form">
      <h2 id="content-dialog-title">Edit content</h2>
      <textarea id="content-editor" spellcheck="false"></textarea>
      <div id="content-preview" class="content-preview"></div>
      <div class="dialog-actions">
        <button value="cancel">Cancel <kbd>Esc</kbd></button>
        <button id="content-apply" value="default">Apply <kbd>Ctrl+Enter</kbd></button>
      </div>
    </form>
  </dialog>

  <dialog id="bibliography-dialog">
    <form method="dialog" class="bibliography-dialog__form">
      <h2>Bibliography</h2>
      <div class="bibliography-tools">
        <input id="bibliography-search" type="search" placeholder="Search references" aria-label="Search references">
        <input id="doi-input" type="text" placeholder="10.xxxx/…" aria-label="DOI">
        <button id="doi-fetch" type="button">Add DOI</button>
      </div>
      <div id="bibliography-list" class="bibliography-list"></div>
      <label class="bibliography-source-label">BibTeX source
        <textarea id="bibliography-source" spellcheck="false"></textarea>
      </label>
      <div id="bibliography-status" role="status"></div>
      <div class="dialog-actions"><button value="cancel">Cancel</button><button id="bibliography-save" type="button">Save bibliography</button></div>
    </form>
  </dialog>

  <dialog id="project-image-dialog">
    <form method="dialog" class="project-image-dialog__form">
      <h2>Choose project image</h2>
      <div class="project-asset-tools">
        <input id="project-image-search" type="search" placeholder="Search images…" aria-label="Search project images">
        <button id="project-image-previous" type="button" aria-label="Previous image page">Previous</button>
        <button id="project-image-next" type="button" aria-label="Next image page">Next</button>
      </div>
      <div id="project-image-gallery" class="project-image-gallery"></div>
      <div id="project-image-status" role="status"></div>
      <div class="dialog-actions"><button value="cancel">Cancel</button></div>
    </form>
  </dialog>

  <dialog id="project-video-dialog">
    <form method="dialog" class="project-image-dialog__form">
      <h2>Choose project video</h2>
      <div class="project-asset-tools">
        <input id="project-video-search" type="search" placeholder="Search videos…" aria-label="Search project videos">
        <button id="project-video-previous" type="button" aria-label="Previous video page">Previous</button>
        <button id="project-video-next" type="button" aria-label="Next video page">Next</button>
      </div>
      <div id="project-video-gallery" class="project-image-gallery"></div>
      <div id="project-video-status" role="status"></div>
      <div class="dialog-actions"><button value="cancel">Cancel</button></div>
    </form>
  </dialog>

  <dialog id="video-conversion-dialog">
    <form class="video-conversion-dialog__form">
      <h2>Converting video</h2>
      <p id="video-conversion-status" role="status">Preparing preview…</p>
      <progress id="video-conversion-progress" max="100" value="0"></progress>
      <div class="dialog-actions"><button id="cancel-video-conversion" type="button">Cancel conversion</button></div>
    </form>
  </dialog>

  <input id="file-input" type="file" accept=".md,.markdown,text/markdown" hidden>
  <input id="image-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml" hidden>
  <input id="video-input" type="file" accept="video/mp4,video/webm,.avi,.mkv,video/x-msvideo,video/x-matroska" hidden>

  <script src="vendor/reveal/reveal.js"></script>
  <script src="vendor/marked/marked.min.js"></script>
  <script src="vendor/yaml/js-yaml.min.js"></script>
  <script src="vendor/bibtex/bibtexParse.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <script type="module" src="modules/app.js"></script>
</body>
</html>
