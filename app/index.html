<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Scientific Slides</title>
  <link rel="stylesheet" href="vendor/reveal/reveal.css">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <header id="toolbar" class="toolbar" aria-label="Presentation editor toolbar">
    <div class="toolbar__group">
      <button id="open-button" type="button">Open</button>
      <button id="save-button" type="button" disabled>Save</button>
      <button id="download-button" type="button" disabled>Download</button>
      <span id="save-state" class="save-state">No deck</span>
    </div>
    <div class="toolbar__group toolbar__modes" role="group" aria-label="Mode">
      <button data-mode="source" type="button">Source</button>
      <button data-mode="design" type="button" class="active">Design</button>
      <button data-mode="present" type="button">Present</button>
    </div>
    <div class="toolbar__group design-only">
      <label>Layout
        <select id="layout-select">
          <option value="1">1</option>
          <option value="1-1">1+1</option>
          <option value="1-2">1+2</option>
          <option value="2-1">2+1</option>
          <option value="0">0</option>
          <option value="front">Front page</option>
          <option value="free">Free (nothing)</option>
        </select>
      </label>
      <button id="add-text" type="button">+ Text</button>
      <button id="add-equation" type="button">+ Equation</button>
      <button id="add-image" type="button">+ Image</button>
      <button id="duplicate-object" type="button" disabled>Duplicate</button>
      <button id="delete-object" type="button" disabled>Delete</button>
    </div>
    <div class="toolbar__group design-only">
      <button id="undo-button" type="button" disabled>Undo</button>
      <button id="redo-button" type="button" disabled>Redo</button>
    </div>
  </header>

  <main id="workspace" class="workspace mode-design">
    <aside id="slide-sidebar" class="slide-sidebar" aria-label="Slides">
      <div class="slide-sidebar-actions" role="group" aria-label="Selected slide actions">
        <button id="add-slide" type="button" title="Add blank slide with the selected layout" aria-label="Add blank slide with the selected layout">+</button>
        <button id="duplicate-slide" type="button" title="Duplicate selected slide" aria-label="Duplicate selected slide">⧉</button>
        <button id="delete-slide" type="button" title="Delete selected slide" aria-label="Delete selected slide">🗑</button>
      </div>
      <ol id="slide-list"></ol>
      <div class="slide-sidebar-move" role="group" aria-label="Move selected slide">
        <button id="move-slide-up" type="button" title="Move selected slide up" aria-label="Move selected slide up">↑</button>
        <button id="move-slide-down" type="button" title="Move selected slide down" aria-label="Move selected slide down">↓</button>
      </div>
    </aside>

    <section id="source-pane" class="source-pane" hidden>
      <textarea id="source-editor" spellcheck="false" aria-label="Markdown source"></textarea>
      <div class="source-actions">
        <button id="apply-source" type="button">Apply</button>
        <button id="revert-source" type="button">Revert</button>
      </div>
    </section>

    <section id="stage" class="stage">
      <div class="reveal">
        <div id="slides" class="slides"></div>
      </div>
    </section>

    <aside id="properties" class="properties design-only" aria-label="Object properties">
      <h2>Properties</h2>
      <div id="no-selection">Select an overlay or cell.</div>
      <form id="object-properties" hidden>
        <label>ID <input id="prop-id" readonly></label>
        <label>Type <input id="prop-type" readonly></label>
        <label>X <input id="prop-x" type="number" step="0.1"></label>
        <label>Y <input id="prop-y" type="number" step="0.1"></label>
        <label>Width <input id="prop-w" type="number" step="0.1"></label>
        <label>Height <input id="prop-h" type="number" step="0.1"></label>
        <label>Fragment <input id="prop-fragment" type="number" min="0" step="1"></label>
        <label>Layer <input id="prop-z" type="number" step="1"></label>
        <label class="check"><input id="prop-locked" type="checkbox"> Locked</label>
        <button id="edit-content" type="button">Edit content</button>
      </form>
      <form id="image-properties" hidden>
        <label>Image fit
          <select id="prop-fit">
            <option value="contain">Fit</option>
            <option value="cover">Fill/crop</option>
            <option value="width">Fit width</option>
            <option value="height">Fit height</option>
            <option value="native">Native</option>
          </select>
        </label>
        <label>Focus X <input id="prop-focus-x" type="range" min="0" max="100"></label>
        <label>Focus Y <input id="prop-focus-y" type="range" min="0" max="100"></label>
      </form>
    </aside>
  </main>

  <dialog id="content-dialog">
    <form method="dialog" class="content-dialog__form">
      <h2 id="content-dialog-title">Edit content</h2>
      <textarea id="content-editor" spellcheck="false"></textarea>
      <div id="content-preview" class="content-preview"></div>
      <div class="dialog-actions">
        <button value="cancel">Cancel <kbd>Esc</kbd></button>
        <button id="content-apply" value="default">Apply <kbd>Ctrl+Enter</kbd></button>
      </div>
    </form>
  </dialog>

  <input id="file-input" type="file" accept=".md,.markdown,text/markdown" hidden>
  <input id="image-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml" hidden>

  <script src="vendor/reveal/reveal.js"></script>
  <script src="vendor/marked/marked.min.js"></script>
  <script src="vendor/yaml/js-yaml.min.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <script type="module" src="modules/app.js"></script>
</body>
</html>
